# Configuration de logging structuré pour production
version: 1
disable_existing_loggers: false

formatters:
  json:
    format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "name": "%(name)s", "message": "%(message)s", "module": "%(module)s", "function": "%(funcName)s", "line": "%(lineno)d", "process": "%(process)d", "thread": "%(thread)d", "extra": %(extra)s}'
    class: pythonjsonlogger.jsonlogger.JsonFormatter
  
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(module)s:%(funcName)s:%(lineno)d - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  access:
    format: '%(message)s'
  
  simple:
    format: '%(levelname)s: %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout
  
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: /app/logs/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
  
  access_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: access
    filename: /app/logs/access.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
  
  metrics:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: /app/logs/metrics.log
    maxBytes: 5242880  # 5MB
    backupCount: 3
  
  # Handler pour les logs structurés vers stdout (pour Kubernetes)
  structured:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout
  
  # Handler pour les alertes critiques
  alert:
    class: logging.handlers.SMTPHandler
    level: CRITICAL
    formatter: detailed
    mailhost: ${SMTP_HOST:-localhost}
    fromaddr: ${ALERT_FROM:-alerts@microagents.io}
    toaddrs: ${ALERT_TO:-devops@microagents.io}
    subject: 'CRITICAL: MicroAgents API Alert'
    credentials: ${SMTP_CREDENTIALS:-}
    secure: ()

loggers:
  # Logger racine
  "":
    level: ${LOG_LEVEL:-INFO}
    handlers: [structured, error_file]
    propagate: false
  
  # Logger de l'application
  microagents:
    level: ${LOG_LEVEL:-INFO}
    handlers: [structured, error_file]
    propagate: false
  
  # Logger d'accès
  uvicorn.access:
    level: INFO
    handlers: [access_file]
    propagate: false
  
  # Logger d'erreur
  uvicorn.error:
    level: INFO
    handlers: [error_file]
    propagate: false
  
  # Logger pour les métriques
  prometheus:
    level: INFO
    handlers: [metrics]
    propagate: false
  
  # Logger pour les connexions aux bases de données
  sqlalchemy.engine:
    level: WARNING
    handlers: [structured]
    propagate: false
  
  # Logger pour les requêtes HTTP
  http.client:
    level: WARNING
    handlers: [structured]
    propagate: false
  
  # Logger pour les appels réseau
  urllib3:
    level: WARNING
    handlers: [structured]
    propagate: false
  
  # Logger pour les websockets
  websockets:
    level: WARNING
    handlers: [structured]
    propagate: false

# Configuration du filtrage
filters:
  healthcheck:
    class: microagents.api.middleware.logging.HealthCheckFilter
  
  sensitive:
    class: microagents.api.middleware.logging.SensitiveDataFilter