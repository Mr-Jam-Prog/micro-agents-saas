apiVersion: apps/v1
kind: Deployment
metadata:
  name: microagents-api
spec:
  template:
    spec:
      containers:
      - name: microagents-api
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        env:
        - name: JAVA_OPTS
          value: "-Xmx1536m -Xms512m -XX:MaxMetaspaceSize=256m"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microagents-worker
spec:
  template:
    spec:
      containers:
      - name: microagents-worker
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        env:
        - name: CONTAINER_MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
              divisor: 1Mi