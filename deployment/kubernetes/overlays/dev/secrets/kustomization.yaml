apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microagents-dev

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- name: postgres-dev-secret
  literals:
    - postgresql-password=devpassword123
    - postgresql-postgres-password=devadmin123
- name: redis-dev-secret
  literals:
    - redis-password=devredis123
- name: tls-dev-secret
  files:
    - tls.crt
    - tls.key
  type: kubernetes.io/tls