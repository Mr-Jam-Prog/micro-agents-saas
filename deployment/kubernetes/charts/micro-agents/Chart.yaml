kubeVersion: ">=1.24.0 <1.28.0"
dependencies:
  - name: redis
    version: "17.11.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
    tags:
      - database
      - cache
      - messaging
    import-values:
      - child: fullnameOverride
        parent: redis.fullname
    alias: redis-cache
  - name: postgresql
    version: "12.9.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    tags:
      - database
      - persistence
    import-values:
      - child: fullnameOverride
        parent: postgresql.fullname
    alias: postgres-db
  - name: ingress-nginx
    version: "4.7.1"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress.enabled
    tags:
      - networking
      - ingress
  - name: cert-manager
    version: "1.13.0"
    repository: "https://charts.jetstack.io"
    condition: tls.enabled
    tags:
      - security
      - tls
      - certificates
  - name: prometheus
    version: "25.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.enabled
    tags:
      - monitoring
      - observability
      - metrics
  - name: grafana
    version: "6.63.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.enabled
    tags:
      - monitoring
      - dashboards
      - visualization
  - name: elasticsearch
    version: "8.5.0"
    repository: "https://helm.elastic.co"
    condition: logging.enabled
    tags:
      - logging
      - observability
      - elk
  - name: vault
    version: "0.25.0"
    repository: "https://helm.releases.hashicorp.com"
    condition: vault.enabled
    tags:
      - security
      - secrets
      - encryption
test: enabled
testImage:
  repository: alpine
  tag: "3.18"
  pullPolicy: IfNotPresent
testSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
testAnnotations:
  test.microagents.io/category: "integration"
  test.microagents.io/timeout: "300s"
securityPolicy:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    privileged: false
  networkPolicy:
    enabled: true
    defaultDeny: true
  serviceAccount:
    create: true
    automountToken: false
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.aws.iamRoleArn }}"
  psp:
    enabled: true
    policy: restricted
  image:
    pullPolicy: IfNotPresent
    pullSecrets: []
    scanner:
      enabled: true
      schedule: "0 2 * * *"
  secrets:
    external: true
    vault:
      enabled: false
      path: "secret/data/microagents"
  compliance:
    pciDss: true
    gdpr: true
    soc2: true
    annotations:
      compliance/microagents.io/level: "high"
deprecated: false
upgradeNotes: |
  ## Version 1.0.0 Upgrade Notes
  
  ### Breaking Changes
  - Database schema upgraded to v2 (requires migration)
  - Redis configuration changed from v6 to v7
  - Agent API v1 deprecated, v2 is now required
  - New required environment variable: `AGENT_API_VERSION=v2`
  
  ### Migration Steps
  
  1. **Backup your data**
     ```bash
     helm get values micro-agents > values-backup.yaml
     kubectl get secret microagents-secrets -o yaml > secrets-backup.yaml
     ```
  
  2. **Run database migration**
     ```bash
     kubectl run migration-job --image=registry.microagents.io/migrate:1.0.0 \
       --env="DATABASE_URL=postgresql://user:pass@postgres:5432/microagents"
     ```
  
  3. **Upgrade the release**
     ```bash
     helm upgrade micro-agents ./micro-agents-platform \
       --namespace microagents-prod \
       --version 1.0.0-prod \
       --values values-backup.yaml \
       --set database.migrate=true
     ```
  
  4. **Verify the upgrade**
     ```bash
     helm test micro-agents --namespace microagents-prod
     kubectl get pods -n microagents-prod
     ```
  
  ### Rollback Procedure
  If issues occur, rollback to previous version:
  ```bash
  helm rollback micro-agents 0.9.0 --namespace microagents-prod
  kubectl apply -f secrets-backup.yaml
  ```
