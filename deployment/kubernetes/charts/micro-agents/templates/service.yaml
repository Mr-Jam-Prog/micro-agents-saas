apiVersion: v1
kind: Service
metadata:
  name: {{ include "micro-agents.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "micro-agents.labels" . | nindent 4 }}
  annotations:
    # Load balancer annotations
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "{{ .Values.ingress.tls.secretName }}"
    # Health check annotations
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
    # Internal load balancer
    service.beta.kubernetes.io/aws-load-balancer-internal: "{{ .Values.service.internal }}"
    # Prometheus scraping
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http-api
    port: 80
    targetPort: http-api
    protocol: TCP
  - name: http-metrics
    port: 9090
    targetPort: http-metrics
    protocol: TCP
    {{- if eq .Values.service.type "NodePort" }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
  - name: http-health
    port: 8080
    targetPort: http-health
    protocol: TCP
  selector:
    {{- include "micro-agents.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  - IPv6
  ipFamilyPolicy: PreferDualStack
  allocateLoadBalancerNodePorts: true