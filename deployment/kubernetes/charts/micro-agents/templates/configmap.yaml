apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "micro-agents.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "micro-agents.labels" . | nindent 4 }}
data:
  # Application configuration
  config.yaml: |
    api:
      host: 0.0.0.0
      port: 8000
      workers: 4
      log_level: {{ .Values.logLevel }}
      timeout: 30
      max_requests: 1000
      keep_alive: 5
    
    database:
      url: postgresql://$(DB_USER):$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}
      pool_size: 20
      pool_recycle: 3600
      echo: false
    
    redis:
      url: redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}
      pool_size: 50
      socket_timeout: 5
    
    monitoring:
      enabled: true
      prometheus_port: 9090
      metrics_path: /metrics
      collect_interval: 15
    
    features:
      rate_limiting: true
      caching: true
      compression: true
      cors: true
    
    security:
      cors_origins: {{ toJson .Values.security.corsOrigins }}
      rate_limit: {{ .Values.security.rateLimit }}
      api_key_header: X-API-Key
  
  # Logging configuration
  logging.conf: |
    [loggers]
    keys=root,uvicorn,api
    
    [handlers]
    keys=console,file
    
    [formatters]
    keys=default,json
    
    [logger_root]
    level={{ .Values.logLevel | upper }}
    handlers=console,file
    
    [logger_uvicorn]
    level=INFO
    handlers=console
    qualname=uvicorn
    propagate=0
    
    [logger_api]
    level={{ .Values.logLevel | upper }}
    handlers=console,file
    qualname=src.api
    propagate=0
    
    [handler_console]
    class=StreamHandler
    level={{ .Values.logLevel | upper }}
    formatter=default
    args=(sys.stdout,)
    
    [handler_file]
    class=handlers.RotatingFileHandler
    level={{ .Values.logLevel | upper }}
    formatter=json
    args=('/app/logs/app.log', 'a', 10485760, 5)
    
    [formatter_default]
    format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
    datefmt=%Y-%m-%d %H:%M:%S
    
    [formatter_json]
    class=pythonjsonlogger.jsonlogger.JsonFormatter
    format=%(asctime)s %(name)s %(levelname)s %(message)s
  
  # Nginx configuration for ingress
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
      worker_connections 1024;
      use epoll;
      multi_accept on;
    }
    
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
      
      access_log /var/log/nginx/access.log main;
      
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      types_hash_max_size 2048;
      
      # Gzip compression
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
      
      # Security headers
      add_header X-Frame-Options SAMEORIGIN;
      add_header X-Content-Type-Options nosniff;
      add_header X-XSS-Protection "1; mode=block";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      
      # Rate limiting
      limit_req_zone $binary_remote_addr zone=api:10m rate={{ .Values.security.rateLimit }}r/s;
      
      # Upstream configuration
      upstream api_backend {
        least_conn;
        server 127.0.0.1:8000;
        keepalive 32;
      }
      
      server {
        listen 80;
        server_name _;
        
        # Health checks
        location /health {
          access_log off;
          proxy_pass http://api_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Metrics
        location /metrics {
          access_log off;
          proxy_pass http://api_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }
        
        # API
        location /api/ {
          limit_req zone=api burst=20 nodelay;
          proxy_pass http://api_backend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection 'upgrade';
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_cache_bypass $http_upgrade;
          proxy_read_timeout 300s;
          proxy_connect_timeout 75s;
        }
        
        # Static files
        location /static/ {
          alias /app/static/;
          expires 1y;
          add_header Cache-Control "public, immutable";
        }
      }
    }