[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "microagents-platform"
version = "1.0.0"
description = "Platforme DevOps intelligente basée sur 1400 micro-agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "DevOps Intelligence Inc.", email = "contact@microagents.io"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Environment :: Console",
]
keywords = ["devops", "microservices", "monitoring", "automation", "cloud", "ai"]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "rich>=13.7",
    "httpx>=0.26",
    "aiohttp>=3.9",
    "asyncio>=3.4",
    "uvloop>=0.19; sys_platform != 'win32'",
    "orjson>=3.9",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "cryptography>=42.0",
    "aioredis>=2.0",
    "msgpack>=1.0",
    "prometheus-client>=0.19",
    "structlog>=24.1",
    "tenacity>=8.2",
    "backoff>=2.2",
    "psutil>=5.9",
]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://microagents.io"
Repository = "https://github.com/microagents/devops-platform"

[project.scripts]
microagents = "microagents.cli:app"
microagents-api = "microagents.api.server:start_server"

[project.optional-dependencies]
api = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
]
cli = [
    "click>=8.1",
    "questionary>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "numpy>=1.24",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "freezegun>=1.2",
    "hypothesis>=6.92",
    "ruff>=0.1",
    "black>=23.11",
    "mypy>=1.7",
    "radon>=6.0",
    "pydocstyle>=6.3",
    "reportlab>=4.0",
    "jinja2>=3.1",
    "python-rapidjson>=1.10",
    "simplejson>=3.19",
    "brotli>=1.1",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "qrcode>=7.4",
    "weasyprint>=60.0",
    "babel>=2.12",
    "pytz>=2023.3",
    "fastavro>=1.8",
    "protobuf>=4.25",
]
all = [
    "microagents-platform[api,cli,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["microagents"]

[tool.hatch.envs.default]
dependencies = [
    "microagents-platform[all]",
]
extra-env-vars = {PYTHONPATH = "."}
