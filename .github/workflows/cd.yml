name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/*]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  schedule:
    # Tests de performance quotidiens
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'
  UV_VERSION: "0.5.0"
  POETRY_VERSION: '1.7.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Job: Validation de qualité de code
  # -----------------------------------------------------------------
  code-quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Linting avec Ruff
        run: uv run ruff check --output-format=github .

      - name: Formatage avec Black
        run: uv run black --check --diff .

      - name: Vérification de types avec MyPy
        run: |
          uv run mypy microagents/ \
            --strict \
            --show-error-codes \
            --no-error-summary \
            --exclude 'tests/|migrations/' \
            --warn-unused-configs \
            --disallow-untyped-defs

      - name: Documentation avec pydocstyle
        run: |
          uv run pydocstyle microagents/ \
            --convention=google \
            --add-ignore=D104,D107,D203,D213,D406,D407,D413

      - name: Vérification des imports
        run: uv run ruff check --select=I --fix .

      - name: Analyse de complexité
        run: uv run radon cc microagents/ -a -s

  # -----------------------------------------------------------------
  # Job: Tests unitaires et d'intégration
  # -----------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
        os: [ubuntu-22.04, ubuntu-24.04]
        include:
          - python-version: '3.12'
          - python-version: '3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install pytest-cov pytest-xdist pytest-benchmark

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ \
            --cov=microagents \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=90 \
            --junitxml=junit-unit.xml \
            -n auto \
            --dist=loadscope

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ \
            --cov=microagents \
            --cov-append \
            --cov-report=xml \
            --junitxml=junit-integration.xml \
            -v

      - name: Run security tests
        run: |
          uv run pytest tests/security/ \
            --junitxml=junit-security.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            junit-*.xml
            coverage.xml
            htmlcov/

  # -----------------------------------------------------------------
  # Job: Performance benchmarks
  # -----------------------------------------------------------------
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run performance benchmarks
        run: |
          uv run pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=benchmarks.json \
            --benchmark-min-rounds=5 \
            --benchmark-warmup=on

      - name: Analyze benchmarks
        run: |
          echo "📊 Performance Benchmarks Results:"
          uv run python -c "
          import json
          with open('benchmarks.json') as f:
              data = json.load(f)
          for bench in data['benchmarks']:
              name = bench['name']
              mean = bench['stats']['mean']
              std = bench['stats']['stddev']
              print(f'{name}: {mean:.6f}s ± {std:.6f}s')
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks.json

      - name: Compare with baseline
        run: |
          if [ -f benchmarks-baseline.json ]; then
            uv run pytest-benchmark compare benchmarks-baseline.json benchmarks.json \
              --csv=benchmark-comparison.csv
          else
            echo "No baseline found. Saving current results as baseline."
            cp benchmarks.json benchmarks-baseline.json
          fi

      - name: Store baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmarks-baseline.json

  # -----------------------------------------------------------------
  # Job: Security scanning
  # -----------------------------------------------------------------
  security:
    name: Security Scanning
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Determine status
        id: status
        run: |
          if [[ ${{ needs.test.result }} == 'success' ]] && \
             [[ ${{ needs.security.result }} == 'success' ]] && \
             [[ ${{ needs.docker-build.result }} == 'success' ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        with:
          channel-id: 'C12345678' # Remplacez par votre channel ID
          slack-message: |
            ${{ steps.status.outputs.emoji }} *CI/CD Pipeline* - ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Status:* ${{ steps.status.outputs.status }}
            *Workflow:* ${{ github.workflow }}
            *View Results:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Send summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          EMOJI: ${{ steps.status.outputs.emoji }}
          STATUS: ${{ steps.status.outputs.status }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
        with:
          script: |
            const { EMOJI, STATUS, TEST_RESULT, SECURITY_RESULT, DOCKER_RESULT } = process.env;

            const summary = {
              test: TEST_RESULT,
              security: SECURITY_RESULT,
              docker: DOCKER_RESULT,
              coverage: '90%+'
            };

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## CI/CD Pipeline Summary ${EMOJI}
              **Status:** ${STATUS}
              **Tests:** ${summary.test}
              **Security:** ${summary.security}
              **Docker Build:** ${summary.docker}
              **Coverage:** ${summary.coverage}
              
              [View Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            } catch (error) {
              console.error("Failed to post comment:", error);
            }
