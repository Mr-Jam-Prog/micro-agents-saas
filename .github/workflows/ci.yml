name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/*]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  schedule:
    # Tests de performance quotidiens
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.1.44'
  POETRY_VERSION: '1.7.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Job: Validation de qualité de code
  # -----------------------------------------------------------------
  code-quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync  --dev

      - name: Linting avec Ruff
        run: uv run ruff check --output-format=github .

      - name: Formatage avec Black
        run: uv run black --check --diff .

      - name: Vérification de types avec MyPy
        run: |
          uv run mypy src/ \
            --strict \
            --show-error-codes \
            --no-error-summary \
            --exclude 'tests/|migrations/' \
            --warn-unused-configs \
            --disallow-untyped-defs

      - name: Documentation avec pydocstyle
        run: |
          uv run pydocstyle src/ \
            --convention=google \
            --add-ignore=D104,D107,D203,D213,D406,D407,D413

      - name: Vérification des imports
        run: uv run ruff check --select=I --fix .

      - name: Analyse de complexité
        run: uv run radon cc src/ -a -s

  # -----------------------------------------------------------------
  # Job: Tests unitaires et d'intégration
  # -----------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
        os: [ubuntu-22.04, ubuntu-24.04]
        include:
          - python-version: '3.12'
            uv-version: '0.1.44'
          - python-version: '3.13'
            uv-version: '0.1.44'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup UV ${{ matrix.uv-version }}
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ matrix.uv-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install pytest-cov pytest-xdist pytest-benchmark

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=90 \
            --junitxml=junit-unit.xml \
            -n auto \
            --dist=loadscope

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ \
            --cov=src \
            --cov-append \
            --cov-report=xml \
            --junitxml=junit-integration.xml \
            -v

      - name: Run security tests
        run: |
          uv run pytest tests/security/ \
            --junitxml=junit-security.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            junit-*.xml
            coverage.xml
            htmlcov/

  # -----------------------------------------------------------------
  # Job: Performance benchmarks
  # -----------------------------------------------------------------
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run performance benchmarks
        run: |
          uv run pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=benchmarks.json \
            --benchmark-min-rounds=5 \
            --benchmark-warmup=on

      - name: Analyze benchmarks
        run: |
          echo "📊 Performance Benchmarks Results:"
          uv run python -c "
          import json
          with open('benchmarks.json') as f:
              data = json.load(f)
          for bench in data['benchmarks']:
              name = bench['name']
              mean = bench['stats']['mean']
              std = bench['stats']['stddev']
              print(f'{name}: {mean:.6f}s ± {std:.6f}s')
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks.json

      - name: Compare with baseline
        run: |
          if [ -f benchmarks-baseline.json ]; then
            uv run pytest-benchmark compare benchmarks-baseline.json benchmarks.json \
              --csv=benchmark-comparison.csv
          else
            echo "No baseline found. Saving current results as baseline."
            cp benchmarks.json benchmarks-baseline.json
          fi

      - name: Store baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmarks-baseline.json

  # -----------------------------------------------------------------
  # Job: Security scanning
  # -----------------------------------------------------------------
  security:
    name: Security Scanning
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner
        run: |
          trivy fs --severity HIGH,CRITICAL --format sarif --output trivy-results.sarif .
          trivy config --severity HIGH,CRITICAL --format sarif --output trivy-config.sarif .

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r src -f json -o bandit-results.json -c .bandit.yml

      - name: Analyze Bandit results
        run: |
          echo "🔒 Bandit Security Scan Results:"
          python -c "
          import json
          with open('bandit-results.json') as f:
              data = json.load(f)
          issues = data.get('results', [])
          if issues:
              for issue in issues:
                  severity = issue.get('issue_severity', 'MEDIUM')
                  confidence = issue.get('issue_confidence', 'MEDIUM')
                  print(f'[{severity}/{confidence}] {issue.get('test_name')}: {issue.get('issue_text')}')
                  print(f'  File: {issue.get('filename')}:{issue.get('line_number')}')
          else:
              print('✅ No security issues found!')
          "

      - name: Dependency vulnerability check
        run: |
          pip install safety
          safety check --json --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            trivy-*.sarif
            bandit-results.json
            safety-report.json

  # -----------------------------------------------------------------
  # Job: Build Docker images
  # -----------------------------------------------------------------
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [test, security]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      packages: write
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-api
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CLI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/docker/cli.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-cli
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-agent
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker images with Trivy
        run: |
          trivy image --format sarif \
            --output trivy-image.sarif \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-api
          trivy image --format sarif \
            --output trivy-image-cli.sarif \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-cli

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: |
            trivy-image.sarif
            trivy-image-cli.sarif

  # -----------------------------------------------------------------
  # Job: E2E Tests
  # -----------------------------------------------------------------
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microagents_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Wait for services
        run: |
          sleep 10
          python -c "
          import socket, time
          for service, port in [('postgres', 5432), ('redis', 6379)]:
              for _ in range(30):
                  try:
                      sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      sock.settimeout(2)
                      result = sock.connect_ex(('localhost', port))
                      sock.close()
                      if result == 0:
                          print(f'✅ {service} is ready')
                          break
                  except:
                      pass
                  time.sleep(2)
              else:
                  print(f'❌ {service} failed to start')
                  exit(1)
          "

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/microagents_test
          REDIS_URL: redis://localhost:6379/0
          API_URL: http://localhost:8000
        run: |
          # Setup test database
          uv run alembic upgrade head

          # Run E2E tests
          uv run pytest tests/e2e/ \
            --junitxml=junit-e2e.xml \
            --log-cli-level=INFO \
            -v

          # Run chaos engineering tests
          uv run pytest tests/chaos/ \
            --junitxml=junit-chaos.xml \
            -v

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            junit-e2e.xml
            junit-chaos.xml

  # -----------------------------------------------------------------
  # Job: Load Testing
  # -----------------------------------------------------------------
  load-test:
    name: Load Testing
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microagents_load
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Locust
        run: pip install locust

      - name: Run load tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/microagents_load
          REDIS_URL: redis://localhost:6379/0
        run: |
          # Start API in background
          nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          API_PID=$!

          # Wait for API to start
          sleep 10

          # Run load test
          locust -f tests/load/locustfile.py \
            --headless \
            --users 100 \
            --spawn-rate 10 \
            --run-time 5m \
            --html load-test-report.html \
            --csv load-test

          kill $API_PID

      - name: Analyze load test results
        run: |
          echo "📈 Load Test Results Summary:"
          python -c "
          import csv
          with open('load-test_stats.csv') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  if row['Name'] == 'Aggregated':
                      print(f'Total Requests: {row['Request Count']}')
                      print(f'Failure Rate: {row['Failure Rate']}')
                      print(f'Avg Response Time: {row['Median Response Time']}ms')
                      print(f'RPS: {row['Requests/s']}')
          "

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load-test-report.html
            load-test_*.csv

  # -----------------------------------------------------------------
  # Job: Release
  # -----------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [load-test, performance, docker-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Build Python package
        run: |
          pip install build twine
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # -----------------------------------------------------------------
  # Job: Notifications
  # -----------------------------------------------------------------
  notify:
    name: Notifications
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [test, security, docker-build, e2e-tests, load-test]
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [[ ${{ needs.test.result }} == 'success' ]] && \
             [[ ${{ needs.security.result }} == 'success' ]] && \
             [[ ${{ needs.docker-build.result }} == 'success' ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        with:
          channel-id: 'C12345678' # Remplacez par votre channel ID
          slack-message: |
            ${{ steps.status.outputs.emoji }} *CI/CD Pipeline* - ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Status:* ${{ steps.status.outputs.status }}
            *Workflow:* ${{ github.workflow }}
            *View Results:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Send summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });

            const summary = {
              test: ${{ needs.test.result }},
              security: ${{ needs.security.result }},
              docker: ${{ needs.docker-build.result }},
              coverage: '90%+'
            };

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## CI/CD Pipeline Summary ${${{ steps.status.outputs.emoji }}}
              **Status:** ${${{ steps.status.outputs.status }}}
              **Tests:** ${summary.test}
              **Security:** ${summary.security}
              **Docker Build:** ${summary.docker}
              **Coverage:** ${summary.coverage}
              
              [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });
