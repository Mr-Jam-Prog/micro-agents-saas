# Configuration Bandit pour MicroAgents Platform
skips:
  - B101  # assert utilisé - autorisé dans les tests
  - B102  # exec utilisé - autorisé pour la configuration dynamique
  - B103  # setproctitle - autorisé pour le monitoring
  - B104  # hardcoded bind all interfaces - configurable
  - B105  # hardcoded password string - vérifié par detect-secrets
  - B106  # hardcoded password - vérifié par detect-secrets
  - B107  # hardcoded secret - vérifié par detect-secrets
  - B108  # hardcoded tmp directory - configurable
  - B110  # try_except_pass - autorisé pour le graceful degradation
  - B112  # try_except_continue - autorisé pour les boucles de traitement
  - B201  # flask_debug_true - contrôlé par les variables d'environnement

exclude_dirs:
  - tests/
  - docs/
  - .venv/
  - venv/
  - build/
  - dist/
  - __pycache__/
  - .mypy_cache/
  - .pytest_cache/
  - .ruff_cache/

